[router]
listen = "0.0.0.0:8080"
default_region = "north"
trust_proxy = "127.0.0.1/32"
development_allow_client_ip_override = true
router_token = ""
timeout_ms = 2000
max_connections = 128
worker_threads = 8
health_interval_ms = 1000
health_failure_threshold = 2
health_recovery_threshold = 2

[edges.north]
url = "http://north:8080"
[edges.west-central]
url = "http://west-central:8080"
[edges.south-east]
url = "http://south-east:8080"
